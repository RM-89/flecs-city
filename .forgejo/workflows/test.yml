name: Test

on:
  push:
    branches:
      - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: install system dependencies
              run: sudo apt update && sudo apt -y install libxinerama-dev libxcursor-dev xorg-dev libglu1-mesa-dev pkg-config autoconf autoconf-archive automake libtool
            - name: install zig
              uses: https://codeberg.org/mlugg/setup-zig@v2
            - name: checkout code
              uses: actions/checkout@v6
              with:
                submodules: true
            - name: vcpkg bootstrap
              run: ./vcpkg/bootstrap-vcpkg.sh
            - name: vcpkg install
              run: ./vcpkg/vcpkg install --triplet=x64-linux-dynamic
            - name: test
              run: zig build test

